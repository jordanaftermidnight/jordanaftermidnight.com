<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark backing circle -->
  <circle cx="32" cy="32" r="31" fill="#08080F" stroke="#C19A6B" stroke-width="1.2" opacity="0.85"/>
  <!-- Crescent moon: outer disc minus offset inner disc -->
  <mask id="crescent">
    <rect width="64" height="64" fill="black"/>
    <circle cx="32" cy="32" r="20" fill="white"/>
    <circle cx="40" cy="28" r="18" fill="black"/>
  </mask>
  <rect width="64" height="64" fill="#C19A6B" mask="url(#crescent)"/>
</svg>